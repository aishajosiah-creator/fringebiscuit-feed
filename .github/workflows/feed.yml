# Hourly: fetch the newest Instagram posts and publish them to GitHub Pages.
#
# Repository secret (set by Aisha):
#   IG_ACCESS_TOKEN   Fringebiscuit Facebook Page access token. It does not
#                     expire, but Meta's data-access window means the Page
#                     connection must be re-confirmed roughly every 90 days.
#
# Any failed run makes GitHub email the repository owner, which is the
# alert. The last good feed stays live on Pages if a run fails.

name: Instagram feed

on:
  schedule:
    - cron: "17 * * * *"       # hourly, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841403821885014"
          POST_COUNT: "6"
        run: node scripts/fetch-feed.mjs

      - name: Commit if the feed changed
        id: commit
        run: |
          git config user.name "fringebiscuit-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Instagram feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
